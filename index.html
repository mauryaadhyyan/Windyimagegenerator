<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WINDY - Welcome</title>
  <style>
    /* Your full CSS is already very good, so no changes needed */
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #74ebd5 0%, #acb6e5 100%);
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
    }
    .card {
      width: 360px;
      height: 580px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      position: relative;
      overflow: hidden;
      animation: floatCard 4s ease-in-out infinite alternate;
    }
    @keyframes floatCard {
      from { transform: translateY(0px); }
      to { transform: translateY(-20px); }
    }
    .card img.main-img {
      width: 100%;
      height: 48%;
      object-fit: cover;
      border-radius: 30px 30px 0 0;
      animation: imageReveal 2s ease forwards;
    }
    @keyframes imageReveal {
      0% { opacity: 0; transform: scale(1.1); }
      100% { opacity: 1; transform: scale(1); }
    }
    .logo {
      position: absolute;
      top: 15px;
      left: 20px;
      color: blue;
      font-size: 26px;
      font-weight: bold;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.4);
      animation: fadeInLogo 2s ease forwards;
    }
    @keyframes fadeInLogo {
      0% { opacity: 0; transform: translateY(-20px);}
      100% { opacity: 1; transform: translateY(0);}
    }
    .overlay {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
      padding: 20px;
      box-sizing: border-box;
      color: white;
      backdrop-filter: blur(8px);
      border-top-left-radius: 30px;
      border-top-right-radius: 30px;
    }
    .overlay h2, .overlay p {
      overflow: hidden;
      white-space: nowrap;
      border-right: .15em solid rgba(255,255,255,0.7);
      margin: 0 auto;
      letter-spacing: .1em;
      animation:
        typing 3.5s steps(30, end),
        blink-caret .75s step-end infinite;
      width: 0;
    }
    .overlay h2 {
      font-size: 22px;
  background: linear-gradient(135deg, #00FFB7, #00BFFF, #FFC300);
      margin-bottom: 8px;
      font-weight: 600;
      text-align: center;
      animation-delay: 0.5s;
      animation-fill-mode: forwards;
    }
    .overlay p {
      font-size: 12px;
      color: #d0d0d0;
      text-align: center;
      margin-bottom: 20px;
      animation-delay: 4s;
      animation-fill-mode: forwards;
    }
    @keyframes typing {
      from { width: 0 }
      to { width: 100% }
    }
    @keyframes blink-caret {
      from, to { border-color: transparent }
      50% { border-color: white; }
    }
    .overlay label {
      font-size: 11px;
      margin-bottom: 4px;
      display: block;
      color: green;
      margin-top: 10px;
    }
    .overlay input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      font-size: 14px;
      color: #fff;
      outline: none;
      transition: 0.3s ease;
      backdrop-filter: blur(5px);
    }
    .overlay input::placeholder {
      color: #cccccc;
    }
    .overlay input:focus {
      background: rgba(255,255,255,0.2);
      border: 1px solid #00c6ff;
    }
    .overlay button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: none;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: white;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.4s ease;
      letter-spacing: 1px;
    }
    .overlay button:hover {
      background: linear-gradient(135deg, #0072ff, #00c6ff);
    }
    .floating-image {
      position: absolute;
      top: -25px;
      right: -25px;
      width: 120px;
      opacity: 0.6;
      transform: rotate(20deg);
      animation: floatImage 5s ease-in-out infinite alternate;
    }
    @keyframes floatImage {
      0% { transform: translateY(0) rotate(20deg); }
      100% { transform: translateY(15px) rotate(25deg); }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">WINDY</div>
  <img src="https://i.ibb.co/RkKp4K7R/Picsart-25-04-12-05-39-51-307.png" alt="Windy Main Image" class="main-img">
  <img src="https://i.ibb.co/RkKp4K7R/Picsart-25-04-12-05-39-51-307.png" alt="Floating Element" class="floating-image">
  
  <div class="overlay">
    <h2>Join WINDY</h2>
    <p>Build the imagination.</p>
    <form id="contact-form">
      <input type="hidden" name="access_key" value="151df3b7-0af4-44f5-9677-df5f80a779de">
      
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Your full name" required>

      <label for="phone">Phone</label>
      <input type="tel" id="phone" name="phone" placeholder="Phone number" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Email address" required>

      <label for="age">Age</label>
      <input type="number" id="age" name="age" placeholder="Your age" required>

      <button type="submit">Submit</button>
    </form>
  </div>
</div>

<script>
  document.getElementById("contact-form").addEventListener("submit", function (e) {
    e.preventDefault();

    const formData = new FormData(this);

    fetch("https://api.web3forms.com/submit", {
      method: "POST",
      body: formData
    })
    .then(response => response.json())
    .then(data => {
      if (data.success) {
        alert("Welcome to WINDY!");
        window.location.href = "https://tfwindyimagegenrator.tiiny.site/"; // change to your own page!
      } else {
        alert("Connecting failed. Please try again later.");
      }
    })
    .catch(error => {
      console.error("Error:", error);
      alert("Something went wrong!");
    });
  });
</script>

</body>
</html>
